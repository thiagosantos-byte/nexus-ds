openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /workspace/catalog:
    get:
      operationId: getWorkspaceCatalog
      summary: Instituições disponíveis para solicitação de acesso
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Catálogo de instituições ativas}
        "401": {description: Sessão inválida}
  /workspace/{institutionId}:
    get:
      operationId: readWorkspace
      summary: Dados e capacidades autorizados para o usuário e instituição
      security: [{bearerAuth: []}]
      parameters:
        - {name: institutionId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Contexto institucional filtrado pelo servidor}
        "401": {description: Sessão inválida}
        "403": {description: Vínculo ou instituição sem acesso ativo}
  /workspace/{institutionId}/commands:
    post:
      operationId: executeWorkspaceCommand
      summary: Operação validada, autorizada e auditada atomicamente
      security: [{bearerAuth: []}]
      parameters:
        - {name: institutionId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, data]
              properties:
                action:
                  type: string
                  enum: [access.request, member.save, project.save, project.team, criterion.save, event.save, event.status, event.publish, evaluation.submit]
                data: {type: object, additionalProperties: true}
      responses:
        "200": {description: Operação registrada com identificador}
        "400": {description: Campos ou transição inválidos}
        "401": {description: Sessão inválida}
        "403": {description: Ação não autorizada}
        "404": {description: Registro ausente neste contexto}
  /workspace/{institutionId}/export:
    get:
      operationId: exportWorkspace
      summary: CSV ou Excel autorizado para gestão institucional
      security: [{bearerAuth: []}]
      parameters:
        - {name: institutionId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: type, in: query, required: true, schema: {type: string, enum: [projects, results]}}
        - {name: format, in: query, schema: {type: string, enum: [csv, xlsx], default: csv}}
        - {name: event, in: query, schema: {type: string, format: uuid, description: Required for result exports}}
        - {name: year, in: query, schema: {type: integer, minimum: 2000, maximum: 2200, description: Optional portfolio filter}}
        - {name: semester, in: query, schema: {type: integer, enum: [1, 2], description: Optional portfolio filter}}
        - {name: student, in: query, schema: {type: string, format: uuid, description: Optional portfolio filter; must be a student associated with an accessible project}}
      responses:
        "200":
          description: Arquivo CSV ou XLSX com filtros institucionais autorizados
          content:
            text/csv:
              schema: {type: string}
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: {type: string, format: binary}
        "401": {description: Sessão inválida}
        "403": {description: Exportação restrita à gestão}
        "404": {description: Resultado não encontrado neste contexto}
  /admin/institutions:
    get:
      operationId: listPlatformInstitutions
      summary: Lista instituições para superadministrador sem exigir vínculo institucional
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Instituições visíveis à administração da plataforma}
        "401": {description: Sessão inválida}
        "403": {description: Privilégio de plataforma ausente ou revogado}
    post:
      operationId: createPlatformInstitution
      summary: Cria instituição e auditoria atomicamente
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 200}
      responses:
        "201": {description: Instituição criada}
        "400": {description: Entrada inválida}
        "401": {description: Sessão inválida}
        "403": {description: Privilégio de plataforma ausente ou revogado}
  /admin/institutions/{id}:
    patch:
      operationId: setPlatformInstitutionStatus
      summary: Suspende ou ativa instituição com auditoria atômica
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: {type: string, enum: [active, suspended]}
      responses:
        "200": {description: Instituição atualizada}
        "400": {description: Entrada inválida}
        "401": {description: Sessão inválida}
        "403": {description: Privilégio de plataforma ausente ou revogado}
        "404": {description: Instituição inexistente}
  /auth/me:
    get:
      operationId: getIdentity
      summary: Identidade verificada e vínculos da própria pessoa
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Identidade validada com Supabase Auth e dados filtrados por RLS
          content:
            application/json:
              schema:
                type: object
                required: [user, memberships, isPlatformAdministrator]
                properties:
                  user:
                    type: object
                    required: [id]
                    properties:
                      id:
                        type: string
                        format: uuid
                      email:
                        type: string
                  memberships:
                    type: array
                    items:
                      type: object
                      description: Vínculo próprio, instituição e papéis; operações de negócio revalidam autorização no servidor
                  isPlatformAdministrator:
                    type: boolean
        "401":
          description: Sessão ausente, inválida ou anônima
        "503":
          description: Configuração ou serviço de identidade indisponível
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

